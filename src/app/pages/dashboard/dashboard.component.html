<app-header></app-header>

<main style="padding: 2rem 10%;">
  <header style="margin-bottom: 2rem;">
    <h1>Bem-vindo, {{ userName }}!</h1>
    <p style="color: #64748b;">Aqui está o resumo das suas finanças hoje.</p>
  </header>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
    <div style="background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      <span style="font-size: 0.9rem; color: #64748b;">Saldo disponível</span>
      <h2 style="font-size: 2rem; margin: 0.5rem 0;">R$ 4.500,00</h2>
      <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Nova Transação</button>
    </div>

    <div style="background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      <h3 style="margin-top: 0;">Atividades Recentes</h3>
      <ul style="list-style: none; padding: 0;">
        <li style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f1f5f9;">
          <span>Mercado</span>
          <span style="color: #ef4444; font-weight: bold;">- R$ 250,00</span>
        </li>
        <li style="display: flex; justify-content: space-between; padding: 0.5rem 0;">
          <span>Salário</span>
          <span style="color: #10b981; font-weight: bold;">+ R$ 5.000,00</span>
        </li>
      </ul>
    </div>
  </div>
</main>
